<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Not A Troll Game (Totally Safe) by Migz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- PORTRAIT WARNING -->
  <div id="rotate-warning">
    ↻ I-rotate ang cellphone sa Landscape mode para maglaro!
  </div>

  <!-- TITLE SCREEN -->
  <div id="title-screen" class="screen">
    <div class="title-box">
      <h1>Not A Troll Game (Totally Safe)</h1>
      <p class="dev-credit">by Migz</p>
      <div class="menu-buttons">
        <button id="play-btn" class="ld-btn">PLAY</button>
        <button id="stages-btn" class="ld-btn secondary-btn">STAGES</button>
      </div>
    </div>
  </div>

  <!-- STAGE SELECT MODAL -->
  <div id="stage-select-modal" class="hidden">
    <div class="title-box stage-box">
      <h2>SELECT STAGE</h2>
      <p class="stage-sub">Piliin ang natapos na stage</p>
      <div id="stage-grid" class="stage-grid"></div>
      <button id="close-stages-btn" class="ld-btn secondary-btn">BACK</button>
    </div>
  </div>

  <!-- GAME SCREEN -->
  <div id="game-screen" class="screen hidden">
    <div id="hud">
      <div class="hud-left">
        <button id="menu-btn" class="hud-btn">❚❚</button>
        <button id="hud-stages-btn" class="hud-btn">STAGES</button>
        <button id="reset-btn" class="hud-btn">↻</button>
      </div>
      <div class="hud-right">
        <span>STAGE <b id="lvl-display">1</b>/40</span>
        <span>DEATHS: <b id="death-display">0</b></span>
      </div>
    </div>

    <canvas id="game-canvas" width="800" height="400"></canvas>

    <div id="touch-controls">
      <div class="dpad">
        <button id="btn-left" class="ctrl-btn">◀</button>
        <button id="btn-right" class="ctrl-btn">▶</button>
      </div>
      <button id="btn-jump" class="ctrl-btn">▲</button>
    </div>
  </div>

  <!-- VICTORY MODAL -->
  <div id="victory-modal" class="hidden">
    <div class="title-box">
      <h1>ALL 40 STAGES CLEARED!</h1>
      <p class="dev-credit">Total Deaths: <span id="final-deaths">0</span></p>
      <p class="dev-credit" style="font-size: 13px;">Not A Troll Game (Totally Safe) by Migz</p>
      <div class="menu-buttons">
        <button id="replay-btn" class="ld-btn">PLAY AGAIN</button>
        <button id="win-stages-btn" class="ld-btn secondary-btn">STAGES</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
